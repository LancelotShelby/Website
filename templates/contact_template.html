<!DOCTYPE html>
<html lang="en">

<head>

<body>
    {% include 'header_template.html' %}
    <div class="main-content-wrapper">
        <main class="contact-main">
            <section class="contact-options">
                <h2>Choose How to Contact Us</h2>

                <div class="options-container">

                    <a class="contact-option" href="https://wa.me/905527267808" target="_blank">

                        <span>Chat via WhatsApp</span>
                    </a>

                    <!-- Email -->
                    <a class="contact-option" href="mailto:kolaelbahariconsulting@gmail.com">
                        <i class="fa-solid fa-envelope"></i>
                        <span>Send an Email</span>
                    </a>

                    <!-- Face to Face -->
                    <a class="contact-option" href="https://maps.app.goo.gl/QQybcCWd8zfT2jym8" target="_blank"

                        <i class="fa-solid fa-map"></i>

            <!-- Embedded Map + Address -->

                    width="50%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>

                <div class="map-address">
                    <p><strong>Office Address:</strong> Akşemsettin, Halıcılar Cd. no: 96/A, 34080 Fatih/İstanbul,
                        Turkey</p>
                </div>
            </section>
        </main>
    </div>
